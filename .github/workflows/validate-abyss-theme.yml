name: Validate Abyss Theme preview

on:
  push:
    paths:
      - 'plugins/abyss-theme/**'
      - 'scripts/package_abyss_theme.py'
      - 'scripts/test_abyss_theme_live.py'
      - '.github/workflows/validate-abyss-theme.yml'
  pull_request:
    paths:
      - 'plugins/abyss-theme/**'
      - 'scripts/package_abyss_theme.py'
      - 'scripts/test_abyss_theme_live.py'
      - '.github/workflows/validate-abyss-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet test plugins/abyss-theme/tests/AbyssTheme.Tests.csproj -c Release
      - run: node --test plugins/abyss-theme/tests/runtime.test.cjs
      - run: python scripts/package_abyss_theme.py
      - uses: actions/upload-artifact@v4
        with:
          name: AbyssTheme-preview
          path: dist/AbyssTheme-*.zip
