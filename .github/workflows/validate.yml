name: Validate plugin catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test catalog tooling
        run: python -m unittest discover -s tests -v
      - name: Validate published manifest
        run: python scripts/catalog.py build --check
